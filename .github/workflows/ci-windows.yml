---
name: Build and test on Windows

on:
  push:
    branches:
      - grass[0-9]+
  pull_request:
  schedule:
    # 01:00 Pacific Time (in UTC), every day (late night PT)
    - cron: 0 8 * * *
  workflow_dispatch:

concurrency:
  # The event is part of the group, so that a push cannot cancel a pending
  # nightly or manually started build, which are the ones publishing addons.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress:
    # Do not cancel on protected branches, like grass8
    ${{ github.ref_protected != true }}

permissions: {}

jobs:
  build:
    name: Build for GRASS ${{ matrix.grass-ref }}
    runs-on: windows-2022
    strategy:
      # Build against the GRASS versions users get from OSGeo4W: the tag of
      # the released version for the grass package and main for the nightly
      # grass-dev package. GRASS is compiled here with the same toolchain
      # and OSGeo4W libraries as those packages.
      matrix:
        grass-ref:
          - "8.5.0"
          - main
      fail-fast: false
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OSGeo/grass
          ref: ${{ matrix.grass-ref }}
          path: grass
          persist-credentials: false

      - name: Checkout addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grass-addons
          persist-credentials: false

      - name: MSYS2 setup
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          path-type: inherit
          location: D:\
          update: true
          msystem: MINGW64
          install: >-
            bison
            diffutils
            dos2unix
            flex
            git
            libintl
            make
            tar
            zip
          pacboy: >-
            bzip2
            ccache
            fftw
            gcc
            gettext
            libiconv
            libsystre
            libtre
            libwinpthread-git
            openblas
            pcre
            pkgconf
            toolchain
            zlib

      - name: Setup OSGeo4W environment
        uses: echoix/setup-OSGeo4W@1e711832882e03603e9013181a87885b10af8a98 # v0.3.0
        id: osgeo4w
        with:
          package-dir: "D:/OSGeo4W_pkg"
          packages: |
            cairo-devel
            freetype-devel
            gdal-devel
            geos-devel
            libjpeg-turbo-devel
            liblas-devel
            libpng-devel
            libpq-devel
            libtiff-devel
            netcdf-devel
            proj-devel
            python3-core
            python3-gdal
            python3-jupyter
            python3-matplotlib
            python3-numpy
            python3-pip
            python3-pywin32
            python3-wxpython
            sqlite3-devel
            zstd-devel
      - name: Set number of cores for compilation
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"
        shell: msys2 {0}

      - name: Compile GRASS
        working-directory: grass
        shell: msys2 {0}
        # The OSGeo4W build script is called directly (not through
        # .github/workflows/build_osgeo4w.sh) to avoid the UNITTEST additions
        # which would end up in the package.
        run: |
          # The 8.5.0 tag predates the move of the cairo headers to
          # include/cairo in OSGeo4W (fixed on main in OSGeo/grass#7507).
          # Apply the same one-line change as the OSGeo4W grass package
          # recipe does; it is a no-op on newer sources.
          sed -i 's#\(--with-cairo-includes=${OSGEO4W_ROOT_MSYS}/include\) #\1/cairo #' \
              mswindows/osgeo4w/build_osgeo4w.sh
          export OSGEO4W_ROOT_MSYS=/c/OSGeo4W
          export SRC=$(pwd)
          mswindows/osgeo4w/build_osgeo4w.sh

      - name: Install GRASS into the OSGeo4W tree
        working-directory: grass
        shell: msys2 {0}
        # Mirrors the install and packaging preparation steps of
        # mswindows/osgeo4w/package.sh used by the wingrass-maintenance-scripts
        # builds (except for the MSVC .lib files which need Visual Studio and
        # are not part of the standalone installer).
        run: |
          export PATH=/c/OSGeo4W/bin:/usr/bin:/mingw64/bin
          export PYTHONHOME=/c/OSGeo4W/apps/Python312
          # Recreate etc/fontcap in the dist tree; build_osgeo4w.sh removes it
          # but make install requires it and cannot rebuild it itself.
          make -C general/g.mkfontcap
          make install
          ver=$(sed -n '/^INST_DIR[ \t]*=/{s/^.*grass//; p}' include/Make/Platform.make)
          echo "GRASS_VER=${ver}" >> "${GITHUB_ENV}"
          prefix=/c/OSGeo4W/apps/grass/grass${ver}
          # The full version string (e.g. 8.5.0 or 8.6.0dev) is the one
          # g.version reports and g.extension uses to locate the addons, so a
          # download location named after it cannot drift from what
          # g.extension expects.
          echo "GRASS_VERSION=$(cut -d ' ' -f 1 ${prefix}/etc/VERSIONNUMBER)" >> "${GITHUB_ENV}"
          echo "GRASS_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          mv ${prefix}/include/grass/config.h ${prefix}/include/grass/config.h.mingw
          cp mswindows/osgeo4w/config.h.switch ${prefix}/include/grass/config.h
          cp mswindows/osgeo4w/config.h.vc ${prefix}/include/grass
          mv ${prefix}/etc/grass.py ${prefix}/etc/grass${ver}.py
          cp -uv $(find ${prefix} -iname "*.dll" -o -iname "*.exe" \
              | PATH=${prefix}/lib:/c/OSGeo4W/bin:/mingw64/bin:/usr/bin xargs ldd \
              | sed -ne 's#^.* => \(/mingw64/bin/.*\) (.*)$#\1#p' \
              | sort -u) ${prefix}/bin
          cp scripts/windows_launch.bat scripts/windows_sh_launch.bat ${prefix}/scripts/
          # Linking an executable needs the manifest templates and the icon
          # from the source tree (see include/Make/Compile.make), which
          # make install does not copy. Without them no C addon is built.
          mkdir -p ${prefix}/mswindows
          cp mswindows/generic.manifest mswindows/generic.manifest.rc.in \
              mswindows/grass.ico ${prefix}/mswindows/

      - name: Compile GRASS Addons
        shell: msys2 {0}
        env:
          GRASS_REF: ${{ matrix.grass-ref }}
          MAX_FAILED: "40"
        run: |
          SRC_ADDONS="$(cygpath -u $GITHUB_WORKSPACE)/grass-addons/src"
          SRC_GRASS=/c/OSGeo4W/apps/grass/grass${GRASS_VER}
          DST_DIR="$(cygpath -u $GITHUB_WORKSPACE)/addons"

          # The CPU architecture GRASS is compiled for is the first part of
          # the host type determined by configure (x86_64-w64-mingw32).
          arch=$(sed -n '/^ARCH[ \t]*=/{s/^.*=[ \t]*//; s/-.*//; p}' \
              ${SRC_GRASS}/include/Make/Platform.make)
          if [ -z "${arch}" ]; then
            echo "::error::Cannot determine the CPU architecture of GRASS"
            exit 1
          fi

          export PATH=/c/OSGeo4W/bin:/usr/bin:/mingw64/bin
          export PYTHONHOME=/c/OSGeo4W/apps/Python312

          grass-addons/.github/workflows/windows_addons_compile.sh $SRC_ADDONS $SRC_GRASS $DST_DIR 1

          # A few addons do not compile on Windows, which is accepted. When
          # many fail or none is compiled, the build is taken as broken and
          # fails here, so that its addons are not published and the server
          # keeps the ones from the previous build.
          built=$(grep -c 'SUCCESS$' "$DST_DIR/logs/index.log" || true)
          failed=$(grep -c 'FAILED$' "$DST_DIR/logs/index.log" || true)
          echo "$built addons compiled, $failed failed to compile"
          sed -n 's/^\(.*[^ ]\) *FAILED$/  \1/p' "$DST_DIR/logs/index.log"
          error=""
          if [ "$built" -eq 0 ]; then
            error="No addon was compiled"
          elif [ "$failed" -gt "$MAX_FAILED" ]; then
            error="$failed addons failed to compile, at most $MAX_FAILED are accepted"
          fi
          if [ -n "$error" ]; then
            echo "::error::$error"
            # Only the logs are left for the artifact of the failed build.
            find "$DST_DIR" -mindepth 1 -maxdepth 1 ! -name logs -exec rm -rf {} +
            exit 1
          fi

          cd $DST_DIR
          for d in `ls -d */`; do
            mod=${d%%/}
            if [ $mod == "logs" ] ; then
              continue
            fi
            cd $mod
            echo $mod
            for f in `ls bin/*.bat 2> /dev/null` ; do
              echo $f
              sed "s/GISBASE/GRASS_ADDON_BASE/" $f > tmp
              mv tmp $f
            done
            rm -rf grass-addons
            zip -r ../$mod.zip *
            cd ..
            rm -rf $mod
            md5sum $mod.zip > ${mod}.md5sum
          done
          # Keep the per-addon build logs as one archive next to the addons.
          zip -r logs.zip logs
          rm -rf logs
          {
            echo "grass_version=${GRASS_VERSION}"
            echo "grass_ref=${GRASS_REF}"
            echo "grass_commit=${GRASS_COMMIT}"
            echo "arch=${arch}"
            echo "addons_commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Run pytest tests
        timeout-minutes: 20
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u $GITHUB_WORKSPACE)"
          GRASS_DIR=/c/OSGeo4W/apps/grass/grass${GRASS_VER}
          ADDONS="${WORKSPACE}/addons-installed"
          PYTHON=/c/OSGeo4W/apps/Python312/python.exe

          export PYTHONHOME=/c/OSGeo4W/apps/Python312
          PATH="${GRASS_DIR}/bin:${GRASS_DIR}/lib:${ADDONS}/bin:${ADDONS}/scripts"
          export PATH="${PATH}:/c/OSGeo4W/bin:/usr/bin:/mingw64/bin"

          # The compile step leaves one zip per addon (plus the build logs);
          # unpack the addons into one directory, as g.extension would,
          # so tests use what users get.
          mkdir "$ADDONS"
          for zip in "${WORKSPACE}"/addons/*.zip; do
            [ "$(basename "$zip")" = "logs.zip" ] && continue
            "$PYTHON" -m zipfile -e "$zip" "$ADDONS"
          done

          "$PYTHON" -m pip install -r grass-addons/.github/workflows/requirements.txt

          # Windows Python needs Windows-style paths (no grass command here).
          export GISBASE="$(cygpath -w "$GRASS_DIR")"
          export GRASS_ADDON_BASE="$(cygpath -w "$ADDONS")"
          # GDAL and PROJ cannot find their data files here (e.g. osmconf.ini).
          export GDAL_DATA="$(cygpath -w /c/OSGeo4W/apps/gdal/share/gdal)"
          export PROJ_DATA="$(cygpath -w /c/OSGeo4W/share/proj)"
          # Addons that bundle a Python package install it under etc/<tool>/;
          # add those dirs so their tests can import the package.
          etc_paths="$(find "$ADDONS/etc" -maxdepth 1 -type d -name '*.*' | paste -sd: -)"
          PYTHONPATH="$(cygpath -pw "${GRASS_DIR}/etc/python:${etc_paths}")"
          export PYTHONPATH

          cd grass-addons/src
          status=0
          while IFS= read -r tests_dir; do
            addon="$(dirname "$tests_dir")"
            pytest_args=()
            case "$addon" in
              # r.estimap.recreation uses downloads data
              # over the network, so we skip it for CI.
              ./raster/r.estimap.recreation) continue ;;
              # Shell script; shell-script addons and r.stream.* tools
              # do not build on Windows.
              ./raster/r.stream.variables) continue ;;
              # C tools that currently fail to compile on Windows.
              ./raster/r.dem/r.dem.icp | ./raster/r.dem/r.dem.nk) continue ;;
              # Tests fail on Windows when parsing v.out.ascii output;
              # needs investigation.
              ./raster/r.centroids | ./vector/v.profile.points) continue ;;
              # Integration tests need network and run only when GISBASE is set (not set on Linux CI);
              # on Windows they fail: grass.script has no attribute 'vector_info_topo'.
              ./vector/v.in.ags) pytest_args=(-k "not TestIntegration") ;;
            esac
            if [ -f "$addon/requirements.txt" ]; then
              "$PYTHON" -m pip install -r "$addon/requirements.txt"
            fi
            echo "::group::pytest $addon"
            # For increased isolation, run each addon in its own process.
            rc=0
            "$PYTHON" -m pytest --verbose --color=yes -ra "${pytest_args[@]}" "$tests_dir" || rc=$?
            echo "::endgroup::"
            # rc 5 means no tests were collected; only other codes are failures.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then status=1; fi
          done < <(find . -type d -name tests | sort)
          exit "$status"

      - name: Make GRASS Addons available
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grass-addons-windows-${{ matrix.grass-ref }}
          path: addons
          retention-days: 3

  publish:
    name: Bundle addons and publish pre-release
    # The addons are published as one ZIP file per GRASS version on a
    # pre-release created for each nightly build. A cronjob on
    # grass.osgeo.org downloads the newest ZIP files and unpacks them to
    # where g.extension on Windows looks for them, so no token is needed on
    # the server.
    #
    # The job runs also when one of the builds failed, so that the addons for
    # the other GRASS version are still published.
    if: ${{ !cancelled() }}
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      # Only the nightly and the manually started builds of the default branch
      # of the main repository publish, never pushes, pull requests or forks.
      # In those, the job only checks that the addons can be bundled.
      PUBLISH: >-
        ${{ (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch') &&
        github.repository == 'OSGeo/grass-addons' &&
        github.ref == 'refs/heads/grass8' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the addons built for each GRASS version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grass-addons-windows-*
          path: artifacts

      - name: Bundle the addons by GRASS version
        id: bundle
        run: |
          shopt -s nullglob
          bundles="${PWD}/bundles"
          mkdir "${bundles}"
          for dir in artifacts/*/; do
            # build-info.txt is written at the very end of a build, so an
            # artifact without it comes from a build which failed.
            version=""
            arch=""
            if [[ -f "${dir}build-info.txt" ]]; then
              version="$(sed -n 's/^grass_version=//p' "${dir}build-info.txt")"
              arch="$(sed -n 's/^arch=//p' "${dir}build-info.txt")"
            fi
            if [[ -z "${version}" || -z "${arch}" ]]; then
              echo "::warning::Skipping the incomplete build in ${dir}"
              continue
            fi
            # The addons are already compressed, so they are only stored.
            # The name says what the file is when it is downloaded by hand
            # and carries the distribution and the CPU architecture the
            # addons are compiled for, so that bundles for other, incompatible
            # builds of the same GRASS version can be added later.
            bundle="grass-${version}-addons-windows-osgeo4w-${arch}.zip"
            (cd "${dir}" && zip -q -r -0 "${bundles}/${bundle}" .)
            (cd "${bundles}" && sha256sum "${bundle}" > "${bundle}.sha256")
          done
          files=("${bundles}"/*.zip)
          echo "count=${#files[@]}" >> "${GITHUB_OUTPUT}"

      # The tag is unique for each build. The server takes the newest
      # pre-release with this tag prefix which contains the ZIP file for
      # the given GRASS version.
      - name: Create the pre-release
        if: ${{ env.PUBLISH == 'true' && steps.bundle.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          tag="windows-addons-${timestamp}-${short_sha}"
          {
            echo "Automated build of GRASS addons for Windows from ${short_sha}."
            echo "Each ZIP file contains all addons compiled for one GRASS"
            echo "version. To install addons, use g.extension in GRASS."
            for bundle in bundles/*.zip; do
              echo
              echo "$(basename "${bundle}"):"
              echo
              echo '```text'
              unzip -p "${bundle}" build-info.txt
              echo '```'
            done
          } > release-notes.md
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Windows addons ${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2} (${short_sha})" \
            --notes-file release-notes.md \
            --prerelease \
            bundles/*

      # Keep the newest $KEEP builds and delete the rest together with their
      # tags. Only the pre-releases created by this job are considered.
      - name: Prune old pre-releases
        if: ${{ env.PUBLISH == 'true' && steps.bundle.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: |
          mapfile -t stale < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 500 \
              --json tagName,publishedAt,isPrerelease \
            | jq -r --argjson keep "${KEEP}" '
                [.[] | select(.isPrerelease
                              and (.tagName | startswith("windows-addons-")))]
                | sort_by(.publishedAt) | reverse | .[$keep:]
                | .[] | .tagName'
          )
          for tag in "${stale[@]}"; do
            echo "Pruning old pre-release ${tag}"
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          done
